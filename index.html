<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Maker</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    .container {
      margin-top: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .card {
      border-radius: 10px;
      border: 1px solid #e3e3e3;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      background-color: #fff;
      padding: 30px;
      margin-bottom: 30px;
    }

    #qrcode {
      width: 100%;
      height: auto;
      margin-top: 20px;
      text-align: center;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 10px;
      background-color: #fff;
    }

    h2 {
      font-weight: 600;
      font-size: 36px;
      color: #007bff;
      text-align: center;
    }

    h3 {
      font-size: 22px;
      font-weight: 600;
      color: #444;
    }

    .form-control {
      border-radius: 0.375rem;
      border: 1px solid #ddd;
    }

    .img-thumbnail {
      border: none;
      background-color: transparent;
    }

    .text-center {
      text-align: center;
    }

    .btn-primary {
      border-radius: 0.375rem;
      background-color: #007bff;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .col-md-8,
    .col-md-4 {
      padding-left: 15px;
      padding-right: 15px;
    }

    /* Mobile responsiveness */
    @media (max-width: 767px) {
      h2 {
        font-size: 28px;
      }

      .col-md-4 {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>QR Code Maker</h2>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <div class="form-group">
              <label for="url" class="form-label">Enter URL:</label>
              <input type="text" name="url" id="url" class="form-control" placeholder="https://example.com" required>
            </div>

            <div class="form-group">
              <label for="qrcode" class="form-label">QR Code:</label>
              <div id="qrcode"></div>
            </div>

            <div class="form-group text-center">
              <button class="btn btn-primary" onclick="makeCode()">Generate QR Code</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-body text-center">
            <h3>Ahsan Ahmed</h3>
            <img src="nfc.png" alt="Ahsan Ahmed QR Code" class="img-fluid" width="200px">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS, jQuery, and QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@gh-pages/qrcode.min.js"></script>

  <script>
    var qrcode = new QRCode("qrcode", {
      text: 'https://ahsanjuly29.github.io/Ahsanjuly29/',
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    function makeCode() {
      var elText = document.getElementById("url");
      if (!elText.value) {
        alert("Please enter a valid URL");
        elText.focus();
        return;
      }
      qrcode.makeCode(elText.value);
    }

    $("#url")
      .on("blur", function () {
        makeCode();
      })
      .on("keydown", function (e) {
        if (e.keyCode == 13) {
          makeCode();
        }
      });
  </script>
</body>

</html>
